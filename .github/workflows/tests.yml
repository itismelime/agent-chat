name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.ps1 starts the service
        shell: pwsh
        run: ./install.ps1
      - name: the service answers, and chat.cmd posts and reads
        shell: pwsh
        run: |
          $env:Path += ";$env:LOCALAPPDATA\agent-chat\bin"
          New-Item -ItemType Directory demo | Out-Null
          chat add demo
          if ($LASTEXITCODE) { throw "chat add failed" }
          Push-Location demo
          chat post --as user "hello from Windows ✓"
          if ($LASTEXITCODE) { throw "chat post failed" }
          Pop-Location
          $r = Invoke-RestMethod -Headers @{ "X-Agent-Chat" = "1" } http://127.0.0.1:8765/api/projects/demo/messages
          $r | ConvertTo-Json -Depth 5
          if (-not ($r.messages | Where-Object { $_.text -eq "hello from Windows ✓" })) { throw "message not found" }
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/).StatusCode
      - name: uninstall
        shell: pwsh
        run: |
          ./install.ps1 -Uninstall
          if (Get-ScheduledTask -TaskName agent-chat -ErrorAction SilentlyContinue) { throw "task left behind" }
